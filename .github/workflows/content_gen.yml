name: Daily AI Content Generator

on:
  schedule:
    # Runs at 03:00 UTC (8:30 AM Indian Standard Time) every single day
    - cron: '0 3 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  generate_content:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        cd automation
        pip install -r requirements.txt
        
    - name: Run Content Generator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        cd automation
        # Generates fresh content for the brand daily
        python content_gen.py --topic "Daily Kashmiri Saffron Highlight" --product "saffron"
        
    - name: Commit and push generated content
      run: |
        git config --global user.name "Kesar Harvester Bot"
        git config --global user.email "bot@kesarharvesters.com"
        git add content/
        git commit -m "Auto-generated daily content via Gemini [skip ci]" || echo "No changes to commit"
        git push
